name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode binary assets
        run: |
          set -euo pipefail
          if [ -d b64 ]; then
            find b64 -type f -name '*.b64' -print | while read -r f; do
              rel="${f#b64/}"
              out="${rel%.b64}"
              mkdir -p "$(dirname "$out")"
              base64 -d "$f" > "$out"
            done
            rm -rf b64
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
